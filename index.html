<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ecosan Pedidos">
<meta name="theme-color" content="#ffffff">
<title>Ecosan Pedidos</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;font-size:15px;min-height:100vh}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:360px;border:1px solid #e8e5de}
.login-logo{display:flex;justify-content:center;margin-bottom:24px}
.login-logo img{height:60px}
.login-title{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:#888;text-align:center;margin-bottom:24px}
.login-group{margin-bottom:14px}
.login-group label{display:block;font-size:12px;font-weight:500;color:#555;margin-bottom:5px}
.login-group input{width:100%;padding:10px 12px;border:1px solid #d8d5cd;border-radius:10px;font-size:15px;outline:none}
.login-group input:focus{border-color:#666}
.login-btn{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;margin-top:8px}
.login-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
/* APP */
.app-wrap{display:none;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e0ddd5;padding:0 16px;display:flex;align-items:center;height:52px;gap:12px;position:sticky;top:0;z-index:100}
.topbar img{height:32px}
.topbar-title{font-size:15px;font-weight:500;flex:1}
.topbar-user{font-size:12px;color:#888}
.logout-btn{font-size:13px;color:#666;background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer}
.tabs{background:#fff;border-bottom:1px solid #e0ddd5;display:flex;padding:0 16px;position:sticky;top:52px;z-index:99}
.tab{padding:12px 16px;font-size:14px;color:#888;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;font-weight:500}
.panel{display:none;padding:16px;max-width:720px;margin:0 auto;width:100%}
.panel.active{display:block}
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;color:#666;margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d8d5cd;border-radius:10px;font-size:15px;color:#1a1a1a;background:#fff;outline:none;font-family:inherit;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:#888}
.prod-row{background:#f9f8f5;border:1px solid #e8e5de;border-radius:10px;padding:12px;margin-bottom:8px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr 70px 36px;gap:8px;align-items:end}
.btn-del{width:36px;height:38px;border:1px solid #e0ddd5;border-radius:8px;background:#fff;cursor:pointer;font-size:18px;color:#aaa;display:flex;align-items:center;justify-content:center}
.btn-del:active{background:#fff0f0;color:#c00}
.btn-add{font-size:13px;color:#2563eb;background:none;border:none;cursor:pointer;padding:6px 0;margin-top:2px}
.btn-primary{width:100%;padding:13px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;margin-top:12px}
.btn-primary:active{background:#333}
.toast{background:#d1fae5;color:#065f46;padding:10px 14px;border-radius:8px;font-size:14px;border:1px solid #6ee7b7;margin-bottom:14px;display:none}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.metric{background:#fff;border:1px solid #e8e5de;border-radius:10px;padding:12px 14px}
.metric-label{font-size:11px;color:#888;margin-bottom:3px}
.metric-value{font-size:20px;font-weight:600}
.filter-row{margin-bottom:14px}
.filter-row select{max-width:240px}
.pedido-card{background:#fff;border:1px solid #e8e5de;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.pedido-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.pedido-cliente{font-weight:600;font-size:15px}
.pedido-meta{font-size:12px;color:#888;margin-bottom:8px}
.pedido-items{font-size:13px}
.pedido-item{padding:4px 0;border-bottom:1px solid #f0ede7;display:flex;justify-content:space-between;align-items:flex-start}
.pedido-item:last-child{border-bottom:none}
.pedido-item-name{font-weight:500}
.pedido-item-pres{font-size:11px;color:#888}
.pedido-item-cant{font-size:13px;font-weight:600;white-space:nowrap;padding-left:8px}
.badge{background:#eff6ff;color:#1d4ed8;font-size:11px;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:500}
.btn-dl{width:100%;margin-top:10px;padding:10px;border:1px solid #d8d5cd;border-radius:8px;background:#f9f8f5;cursor:pointer;font-size:13px;color:#333;font-family:inherit;font-weight:500}
.btn-dl:active{background:#eee}
.pedido-notas{font-size:12px;color:#888;margin-top:6px;font-style:italic}
.empty{text-align:center;color:#bbb;padding:40px 20px;font-size:14px}
.section-title{font-size:12px;font-weight:500;color:#888;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.loading{text-align:center;color:#aaa;padding:20px;font-size:14px}
@media(max-width:480px){
  .prod-grid{grid-template-columns:1fr 1fr 60px 36px}
  .metrics{grid-template-columns:repeat(3,1fr);gap:8px}
  .metric{padding:10px 10px}
  .metric-value{font-size:17px}
}
</style>
</head>

let currentUser = null;

// ── AUTH ──────────────────────────────────────────────────────
async function sbFetch(path, opts={}) {
  const res = await fetch(SUPABASE_URL + path, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...opts.headers
    },
    ...opts
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

async function doLogin() {
  const username = document.getElementById('inp-user').value.trim().toLowerCase();
  const password = document.getElementById('inp-pass').value;
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  if (!username || !password) { err.textContent='Completá usuario y contraseña'; err.style.display='block'; return; }
  try {
    const rows = await sbFetch(`/rest/v1/usuarios?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}&select=*`);
    if (!rows.length) { err.textContent='Usuario o contraseña incorrectos'; err.style.display='block'; return; }
    currentUser = rows[0];
    sessionStorage.setItem('ecosan_user', JSON.stringify(currentUser));
    showApp();
  } catch(e) {
    err.textContent = 'Error de conexión. Intentá de nuevo.';
    err.style.display = 'block';
    console.error(e);
  }
}

document.getElementById('inp-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogout() {
  sessionStorage.removeItem('ecosan_user');
  currentUser = null;
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('app-wrap').style.display = 'none';
  document.getElementById('inp-pass').value = '';
}

function showApp() {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'flex';
  document.getElementById('topbar-user').textContent = currentUser.nombre;
  // Panel del dueño solo visible para rol "dueno"
  const isDueno = currentUser.rol === 'dueno';
  document.getElementById('tab-dueno-btn').style.display = isDueno ? '' : 'none';
  // Reset form
  document.getElementById('productos-list').innerHTML = '';
  addProdRow();
  if (isDueno) renderDueno();
}

window.addEventListener('load', () => {
  const saved = sessionStorage.getItem('ecosan_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    showApp();
  }
});

function addProdRow() {
  const list = document.getElementById('productos-list');
  const id = Date.now();
  const div = document.createElement('div');
  div.className='prod-row'; div.id='row-'+id;
  const opts = PRODUCTOS.map((p,i)=>`<option value="${i}">${p.nome}</option>`).join('');
  div.innerHTML=`<div class="prod-grid">
    <div><label>Producto</label><select onchange="updPres(${id})" id="pr-${id}"><option value="">Seleccioná...</option>${opts}</select></div>
    <div><label>Presentación</label><select id="ps-${id}"><option value="">—</option></select></div>
    <div><label>Cant.</label><input type="number" id="ca-${id}" min="1" value="1" style="width:100%"/></div>
    <div style="display:flex;align-items:flex-end"><button class="btn-del" onclick="document.getElementById('row-${id}').remove()" title="Eliminar">×</button></div>
  </div>`;
  list.appendChild(div);
}

function updPres(id) {
  const idx=document.getElementById('pr-'+id).value;
  const sel=document.getElementById('ps-'+id);
  sel.innerHTML='<option value="">Seleccioná...</option>';
  if(!idx) return;
  PRODUCTOS[idx].pres.forEach(p=>{ const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o); });
  if(PRODUCTOS[idx].pres.length===1) sel.selectedIndex=1;
}

function getRowData(row) {
  const id=row.id.replace('row-','');
  const idx=document.getElementById('pr-'+id)?.value;
  const pres=document.getElementById('ps-'+id)?.value;
  const cant=parseFloat(document.getElementById('ca-'+id)?.value)||0;
  if(!idx||!pres||cant<=0) return null;
  return {nombre:PRODUCTOS[idx].nome, presentacion:pres, cant};
}

async function submitPedido() {
  const cliente=document.getElementById('cliente').value.trim();
  if(!cliente){alert('Ingresá el nombre del cliente.');return;}
  const productos=[];
  let ok=true;
  document.querySelectorAll('.prod-row').forEach(r=>{
    const d=getRowData(r); if(!d){ok=false;return;} productos.push(d);
  });
  if(!ok||!productos.length){alert('Completá al menos un producto.');return;}
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='Guardando...';
  const now=new Date();
  const pedido={
    vendedor_username: currentUser.username,
    vendedor_nombre: currentUser.nombre,
    cliente, productos, 
    notas: document.getElementById('notas').value,
    fecha: now.toLocaleDateString('es-AR'),
    hora: now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})
  };
  try {
    await sbFetch('/rest/v1/pedidos', {method:'POST', body:JSON.stringify(pedido)});
    const t=document.getElementById('toast');
    t.textContent='✓ Pedido de '+cliente+' confirmado';
    t.style.display='block';
    setTimeout(()=>t.style.display='none',3000);
    document.getElementById('cliente').value='';
    document.getElementById('notas').value='';
    document.getElementById('productos-list').innerHTML='';
    addProdRow();
  } catch(e) {
    alert('Error al guardar. Verificá tu conexión.');
    console.error(e);
  }
  btn.disabled=false; btn.textContent='✓ Confirmar pedido';
}

function showTab(t,e) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  e.target.closest('.tab').classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='dueno') renderDueno();
}

async function renderDueno() {
  const filtro=document.getElementById('filtro-vendedor').value;
  const container=document.getElementById('pedidos-list');
  container.innerHTML='<div class="loading">Cargando pedidos...</div>';
  try {
    let url='/rest/v1/pedidos?select=*&order=created_at.desc';
    if(filtro) url+=`&vendedor_username=eq.${encodeURIComponent(filtro)}`;
    const pedidos = await sbFetch(url);
    // Populate filter
    const allPedidos = await sbFetch('/rest/v1/pedidos?select=vendedor_username,vendedor_nombre');
    const vends=[...new Map(allPedidos.map(p=>[p.vendedor_username,p.vendedor_nombre])).entries()];
    const sel=document.getElementById('filtro-vendedor');
    const prev=sel.value;
    sel.innerHTML='<option value="">Todos los vendedores</option>';
    vends.forEach(([u,n])=>{ const o=document.createElement('option');o.value=u;o.textContent=n;if(u===prev)o.selected=true;sel.appendChild(o); });
    document.getElementById('metrics-box').innerHTML=`
      <div class="metric"><div class="metric-label">Pedidos</div><div class="metric-value">${pedidos.length}</div></div>
      <div class="metric"><div class="metric-label">Vendedores</div><div class="metric-value">${vends.length}</div></div>
      <div class="metric"><div class="metric-label">Productos</div><div class="metric-value">${pedidos.reduce((s,p)=>s+(p.productos?.length||0),0)}</div></div>`;
    if(!pedidos.length){container.innerHTML='<div class="empty">📭 No hay pedidos todavía</div>';return;}
    container.innerHTML=pedidos.map(p=>`
      <div class="pedido-card">
        <div class="pedido-top">
          <div><div class="pedido-cliente">${p.cliente}</div></div>
          <span class="badge">${p.productos?.length||0} prod.</span>
        </div>
        <div class="pedido-meta">👤 ${p.vendedor_nombre} &nbsp;·&nbsp; ${p.fecha} ${p.hora}</div>
        <div class="pedido-items">
          ${(p.productos||[]).map(pr=>`<div class="pedido-item"><div><div class="pedido-item-name">${pr.nombre}</div><div class="pedido-item-pres">${pr.presentacion}</div></div><div class="pedido-item-cant">×${pr.cant}</div></div>`).join('')}
        </div>
        ${p.notas?`<div class="pedido-notas">📝 ${p.notas}</div>`:''}
        <button class="btn-dl" onclick="generarPDF(${JSON.stringify(p).replace(/'/g,"\'")})">⬇ Descargar nota de pedido</button>
      </div>`).join('');
  } catch(e) {
    container.innerHTML='<div class="empty">Error cargando pedidos</div>';
    console.error(e);
  }
}

// ── PDF ────────────────────────────────────────────────────────
const ALIASES={
  'arvejas partidas':['arvejas partidas ecosan'],
  'garbanzos':['garbanzos ecosan'],
  'lentejones':['lentejones ecosan'],
  'lentejas':['lentejas ecosan'],
  'maíz pisado colorado':['maíz quebrado colorado ecosan'],
  'maíz pisado blanco':['maiz quebrado blanco ecosan'],
  'maíz pisingallo':['maíz pisingallo colorado ecosan'],
  'porotos alubias':['porotos alubias ecosan'],
  'porotos soja':['porotos soja ecosan'],
  'harina de maíz':['harina de maíz rápida ecosan'],
  'trigo pelado candeal':['trigo pelado candeal ecosan'],
  'trigo burgol':['trigo burgol fino ecosan'],
  'sémola candeal':['sémola de trigo ecosan'],
  'avena arrollada tradic.':['avena arrollada ecosan x 250g'],
  'alpiste':['alpiste ventilado ecosan'],
  'mijo':['mijo ventilado ecosan'],
  'alimento balanceado':['alimento balanc. p/ pajaros ecosan'],
};

function generarPDF(pedido){
  const p=pedido;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const lm=8;

  const pm={};
  p.productos.forEach(pr=>{
    const k=pr.nombre.trim().toLowerCase();
    if(!pm[k]) pm[k]={};
    pm[k][pr.presentacion]=pr.cant;
  });

  function resolve(label,pres){
    const k=label.trim().toLowerCase();
    const candidates=ALIASES[k]||[k];
    for(const c of candidates){
      if(pm[c]){
        if(pres&&pm[c][pres]) return String(pm[c][pres]);
        const v=Object.values(pm[c]);
        return v.length?String(v[0]):'';
      }
    }
    return '';
  }

  function t(text,x,y,sz,bold,align){
    doc.setFontSize(sz||8);
    doc.setFont('helvetica',bold?'bold':'normal');
    const s=String(text);
    if(align==='c') doc.text(s,x,y,{align:'center'});
    else if(align==='r') doc.text(s,x,y,{align:'right'});
    else doc.text(s,x,y);
  }
  function r(x,y,w,h,fill){
    if(fill){doc.setFillColor(...fill);doc.rect(x,y,w,h,'F');}
    doc.setLineWidth(0.4);
    doc.rect(x,y,w,h,'S');
  }
  function ln(x1,y1,x2,y2){doc.line(x1,y1,x2,y2);}

  // ── HEADER ──
  // Borde exterior redondeado — altura 56mm para que entren logo + contacto + fechas
  doc.setLineWidth(1);
  doc.roundedRect(lm, 8, 194, 56, 3, 3, 'S');
  doc.setLineWidth(0.4);

  // Logo Ecosan — arriba izquierda
  try{doc.addImage('data:image/jpeg;base64,'+LOGO_B64,'JPEG',11,11,42,22);}catch(e){}

  // Contacto — debajo del logo, izquierda, centrado
  t('Malvinas Argentinas  1025  /  \u260E (341) 156366745', 52, 38, 7.5, false, 'c');
  t('e-mail: ventas@ecosanalimentos.com.ar', 52, 43, 7.5, false, 'c');
  t('2201 / Ricardone / Santa Fe', 52, 48, 7.5, false, 'c');

  // Centro: caja X + texto
  doc.setLineWidth(0.8);
  doc.rect(84, 12, 11, 11, 'S');
  doc.setLineWidth(0.4);
  t('X', 89.5, 21, 13, true, 'c');
  t('Documento no válido', 98, 16, 8);
  t('como Factura', 98, 21, 8);

  // Derecha: "Nota de Pedido" grande + Nº
  t('Nota de Pedido', 171, 16, 13, true, 'c');
  t('N\u00ba', 171, 22, 9, false, 'c');

  // Fechas: 2 bloques (EMISION + ENTREGA), cada uno con header gris + 3 celdas
  const fx=149, fw=48, fcw=fw/3, fh=5.5;

  // FECHA DE EMISION
  doc.setFillColor(210,210,210);
  doc.rect(fx, 25, fw, fh, 'F');
  doc.setLineWidth(0.5);
  doc.rect(fx, 25, fw, fh, 'S');
  t('FECHA DE EMISION', fx+fw/2, 29.5, 6, true, 'c');
  for(let i=0;i<3;i++) doc.rect(fx+i*fcw, 30.5, fcw, fh, 'S');
  // divisores internos ya incluidos por rect individuales
  if(p.fecha){
    const pts=p.fecha.split('/');
    if(pts.length===3){
      t(pts[0], fx+fcw*0.5,    34.5, 7.5, false, 'c');
      t(pts[1], fx+fcw*1.5,    34.5, 7.5, false, 'c');
      t(pts[2], fx+fcw*2.5,    34.5, 7.5, false, 'c');
    }
  }

  // FECHA DE ENTREGA
  doc.setFillColor(210,210,210);
  doc.rect(fx, 36, fw, fh, 'F');
  doc.rect(fx, 36, fw, fh, 'S');
  t('FECHA DE ENTREGA', fx+fw/2, 40.5, 6, true, 'c');
  for(let i=0;i<3;i++) doc.rect(fx+i*fcw, 41.5, fcw, fh, 'S');

  doc.setLineWidth(0.4);

  // ── CLIENT BOX ──
  // Altura 38mm para que entren todos los campos + Vendedor
  const ct=68;
  doc.setLineWidth(0.8);
  doc.roundedRect(lm, ct, 194, 38, 2, 2, 'S');
  doc.setLineWidth(0.4);

  function dl(label, value, lx, ly, rend){
    t(label+' '+value, lx, ly, 7.5);
    const used = lx + (label.length + value.length) * 1.52 + 2;
    doc.setLineDashPattern([0.5,1.5], 0);
    doc.line(used, ly+0.5, rend, ly+0.5);
    doc.setLineDashPattern([], 0);
  }
  dl('Razón Social:', '', 10, ct+6, 200);
  // Nombre del cliente en negrita encima de la línea punteada
  t(p.cliente, 10+doc.getTextWidth('Razón Social:  '), ct+6, 9.5, true);
  dl('Domicilio:',   '',         10, ct+12, 200);
  dl('N° Postal:',  '',         10, ct+18,  90); dl('Localidad:', '', 93, ct+18, 148); dl('Pcia.:', '', 151, ct+18, 200);
  dl('Transporte:',  '',         10, ct+24,  90); dl('Dirección:', '', 93, ct+24, 200);
  dl('Categoría:',   '',         10, ct+30,  90); dl('IVA N°:',   '', 93, ct+30, 200);
  dl('Plazo:',       '',         10, ct+36,  90); dl('Descuento:','', 93, ct+36, 200);
  t('Vendedor: ', 10, ct+42, 8.5);
  t(p.vendedor, 10+doc.getTextWidth('Vendedor: '), ct+42, 9.5, true);

  // Tables
  const ttop=114, rh=5.5;
  const lx=lm, lw=72, lcol=42, ccol=12, pcol=18;

  // Legumbres header
  doc.setFillColor(210,210,210); doc.rect(lx,ttop,lw,rh,'F');
  doc.setLineWidth(0.4); doc.rect(lx,ttop,lw,rh,'S');
  ln(lx+lcol,ttop,lx+lcol,ttop+rh); ln(lx+lcol+ccol,ttop,lx+lcol+ccol,ttop+rh);
  t('Legumbres Secas',lx+lcol/2,ttop+rh-1.5,7.5,true,'c');
  t('Cant.',lx+lcol+ccol/2,ttop+rh-1.5,7,true,'c');
  t('Precio',lx+lcol+ccol+pcol/2,ttop+rh-1.5,7,true,'c');

  const legumbres=[
    ['Arvejas Partidas','Granel (kg)'],['Garbanzos','Granel (kg)'],['Lentejones','Granel (kg)'],
    ['Lentejas','Granel (kg)'],['Maíz Pisado Colorado','Granel (kg)'],['Maíz Pisado Blanco','Granel (kg)'],
    ['Maíz Pisingallo','Granel (kg)'],['Porotos Alubias','Granel (kg)'],['Porotos Manteca','Granel (kg)'],
    ['Porotos Pallares','Granel (kg)'],['Porotos Soja','Granel (kg)'],['Harina de Maíz','Granel (kg)'],
    ['Trigo Pelado Candeal','Granel (kg)'],['Trigo Burgol','Granel (kg)'],['Sémola Candeal','Granel (kg)'],
    ['Avena Arrollada Tradic.','Granel (kg)'],['Alpiste','Granel (kg)'],['Mijo','Granel (kg)'],
    ['Alimento Balanceado','Granel (kg)'],
  ];
  legumbres.forEach(([nombre,pres],i)=>{
    const ry=ttop+rh+i*rh;
    doc.rect(lx,ry,lw,rh,'S');
    ln(lx+lcol,ry,lx+lcol,ry+rh); ln(lx+lcol+ccol,ry,lx+lcol+ccol,ry+rh);
    t(nombre,lx+1,ry+rh-1.5,7);
    const cant=resolve(nombre,pres);
    if(cant) t(cant,lx+lcol+ccol/2,ry+rh-1.5,9,true,'c');
  });

  // Cereales
  const rx=82, rw=120;
  const cws=[42,10,12,10,12,10,12];
  const cxs=[rx];
  cws.slice(0,-1).forEach(w=>cxs.push(cxs[cxs.length-1]+w));

  doc.setFillColor(210,210,210); doc.rect(rx,ttop,rw,rh,'F');
  doc.rect(rx,ttop,rw,rh,'S');
  ['Cereales','5 Kg','Precio','1 Kg','Precio','100g','Precio'].forEach((h,i)=>{
    t(h,cxs[i]+cws[i]/2,ttop+rh-1.5,i===0?7.5:7,true,'c');
    if(i>0) ln(cxs[i],ttop,cxs[i],ttop+rh);
  });

  const cereales=[
    ['Maíz Inflado Azucarado','maiz inflado azucarado','x 5 Kg','x 1 kg','15x100g'],
    ['Trigo Inflado Azucarado','trigo inflado azucarado','x 5 Kg','x 1 kg',null],
    ['Arroz Inflado Azucarado','arroz inflado azucarado','x 5 Kg','x 1 kg',null],
    ['Maíz Inflado Miel','maiz infl azuc c/miel','x 5 Kg','x 1 kg',null],
    ['Maíz Inflado Stevia','maiz inflado con stevia','x 4kg',null,null],
    ['Bolita Frutal Azucarada','bolitas maiz frutal color','x 5 Kg','x 1 kg',null],
    ['Arito Frutal Azucarado','aritos maiz frutal color','x 5 Kg','x 1 kg','15x100g'],
    ['Bolita Chocolate','bolitas maiz de chocolate','x 5 Kg','x 1 kg',null],
    ['Gusanito Frutal Azuc.','gusanitos maiz frutal color','x 5 Kg','x 1 kg',null],
    ['Gusanito Frutilla Azuc.','gusanitos maiz frutilla','x 5 Kg','x 1 kg','15x100g'],
    ['Copos Azucarados','copos de maiz azucarado',null,'x 1 kg',null],
  ];
  cereales.forEach(([label,key,p5,p1,p100],i)=>{
    const ry=ttop+rh+i*rh;
    doc.rect(rx,ry,rw,rh,'S');
    cxs.slice(1).forEach(x=>ln(x,ry,x,ry+rh));
    t(label,rx+1,ry+rh-1.5,7);
    [[p5,1],[p1,3],[p100,5]].forEach(([pres,ci])=>{
      if(!pres) return;
      const k=key.trim().toLowerCase();
      const val=pm[k]&&pm[k][pres]?String(pm[k][pres]):'';
      if(val) t(val,cxs[ci]+cws[ci]/2,ry+rh-1.5,9,true,'c');
    });
  });

  // Almohaditas
  const atop=ttop+rh+cereales.length*rh;
  doc.setFillColor(210,210,210); doc.rect(rx,atop,rw,rh,'F'); doc.rect(rx,atop,rw,rh,'S');
  ['Almohaditas','x 5 Kg','Precio','5x1kg','Precio','15x200g','Precio'].forEach((h,i)=>{
    t(h,cxs[i]+cws[i]/2,atop+rh-1.5,i===0?7.5:7,true,'c');
    if(i>0) ln(cxs[i],atop,cxs[i],atop+rh);
  });
  const alms=[
    ['Almohaditas Limón','almohaditas de trigo limon','x 5 Kg','5x1kg','15x200g'],
    ['Almohaditas Frutilla','almohaditas de trigo frutilla','x 5 Kg','5x1kg','15x200g'],
    ['Almohaditas Chocolate','almohaditas de trigo chocolate','x 5 Kg','5x1kg','15x200g'],
  ];
  alms.forEach(([label,key,p5,p5k,p15],i)=>{
    const ry=atop+rh+i*rh;
    doc.rect(rx,ry,rw,rh,'S'); cxs.slice(1).forEach(x=>ln(x,ry,x,ry+rh));
    t(label,rx+1,ry+rh-1.5,7);
    [[p5,1],[p5k,3],[p15,5]].forEach(([pres,ci])=>{
      const k=key.trim().toLowerCase();
      const val=pm[k]&&pm[k][pres]?String(pm[k][pres]):'';
      if(val) t(val,cxs[ci]+cws[ci]/2,ry+rh-1.5,9,true,'c');
    });
  });

  // Tostadas
  const ztop=atop+rh+alms.length*rh;
  doc.setFillColor(210,210,210); doc.rect(rx,ztop,rw,rh,'F'); doc.rect(rx,ztop,rw,rh,'S');
  ['Tostadas','1,5 Kg','Precio','5x300g','Precio','15x70g','Precio'].forEach((h,i)=>{
    t(h,cxs[i]+cws[i]/2,ztop+rh-1.5,i===0?7.5:7,true,'c');
    if(i>0) ln(cxs[i],ztop,cxs[i],ztop+rh);
  });
  const ztos=[
    ['Tostada Arroz Dulce','tostatidas de arroz dulce',null,'5x300g',null],
    ['Tostada Arroz Salada','tostaditas de arroz salada',null,'5x300g',null],
  ];
  ztos.forEach(([label,key,,p5x300],i)=>{
    const ry=ztop+rh+i*rh;
    doc.rect(rx,ry,rw,rh,'S'); cxs.slice(1).forEach(x=>ln(x,ry,x,ry+rh));
    t(label,rx+1,ry+rh-1.5,7);
    const k=key.trim().toLowerCase();
    const val=pm[k]&&pm[k][p5x300]?String(pm[k][p5x300]):'';
    if(val) t(val,cxs[3]+cws[3]/2,ry+rh-1.5,9,true,'c');
  });
  for(let i=0;i<2;i++){
    const ry=ztop+rh+ztos.length*rh+i*rh;
    doc.rect(rx,ry,rw,rh,'S'); cxs.slice(1).forEach(x=>ln(x,ry,x,ry+rh));
  }

  // Fill left column to match right
  const rightBot=ztop+rh+ztos.length*rh+2*rh;
  const leftBot=ttop+rh+legumbres.length*rh;
  if(rightBot>leftBot){
    const extra=Math.ceil((rightBot-leftBot)/rh);
    for(let i=0;i<extra;i++){
      const ry=leftBot+i*rh;
      doc.rect(lx,ry,lw,rh,'S');
      ln(lx+lcol,ry,lx+lcol,ry+rh); ln(lx+lcol+ccol,ry,lx+lcol+ccol,ry+rh);
    }
  }

  // Footer
  const footY=Math.max(rightBot,leftBot)+8;
  t('Mercaderías puestas en la ciudad de Rosario. Precios más IVA. Plazo contado.',105,footY,7.5,true,'c');
  t('Precios sujetos a variación sin previo aviso.',105,footY+5,7,false,'c');
  if(p.notas){ t('Obs: ', lm, footY+11, 9, false); t(p.notas, lm+doc.getTextWidth('Obs: '), footY+11, 9.5, true); }

  doc.save('pedido_'+p.cliente.replace(/\s+/g,'_')+'_'+p.fecha.replace(/\//g,'-')+'.pdf');
}
